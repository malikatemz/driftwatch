[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelapi"
version = "0.1.0"
description = "Security monitoring for developer APIs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SentinelAPI", email = "dev@sentinelapi.io"},
]
url = "https://sentinelapi.io"
keywords = ["security", "monitoring", "api", "devsecops", "compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
sentinel = "sentinelapi.cli:cli"

[tool.setuptools]
packages = ["sentinelapi"]

[tool.ruff]
line-length = 88
